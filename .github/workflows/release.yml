name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: owa_calendar
            asset_name: owa_calendar-linux-x86_64
          - os: macos-latest
            artifact_name: owa_calendar
            asset_name: owa_calendar-macos-x86_64
          - os: windows-latest
            artifact_name: owa_calendar.exe
            asset_name: owa_calendar-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable && rustup default stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      - name: Build
        run: dx build --release --platform desktop

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p release-artifact
          find target/dx -type f -name "${{ matrix.artifact_name }}" -not -path "*/deps/*" | head -1 | xargs -I{} cp {} release-artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release-artifact/${{ matrix.artifact_name }}

  release:
    name: Publish Release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release
          [ -f artifacts/owa_calendar-linux-x86_64/owa_calendar ] && cp artifacts/owa_calendar-linux-x86_64/owa_calendar release/owa_calendar-linux-x86_64 || true
          [ -f artifacts/owa_calendar-macos-x86_64/owa_calendar ] && cp artifacts/owa_calendar-macos-x86_64/owa_calendar release/owa_calendar-macos-x86_64 || true
          [ -f "artifacts/owa_calendar-windows-x86_64.exe/owa_calendar.exe" ] && cp "artifacts/owa_calendar-windows-x86_64.exe/owa_calendar.exe" release/owa_calendar-windows-x86_64.exe || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/owa_calendar-linux-x86_64
            release/owa_calendar-macos-x86_64
            release/owa_calendar-windows-x86_64.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
